name: collect

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (정각은 GitHub가 붐벼서 피함)
  workflow_dispatch:         # Actions 탭의 Run workflow 버튼으로 수동 실행

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # 아래 "예약 실행 유지" 단계용

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python collect.py
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}

      # 공개 저장소는 60일 동안 커밋이 없으면 예약 실행이 자동으로 꺼진다.
      # 실행될 때마다 워크플로를 다시 "켜기" 처리해서 그 60일을 계속 새로 시작한다.
      # (gh workflow enable은 이미 켜진 워크플로에 에러를 내서, 같은 일을 하는 API를 직접 부른다)
      - name: 예약 실행 유지
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/collect.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
